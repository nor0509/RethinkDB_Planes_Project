services:
  rethinkdb:
    build: .
    container_name: rethink-lab
    ports:
      - "8080:8080" 
      - "28015:28015"
    volumes:
      - ./rethink-data:/data:z
  flight_producer:
      build: 
        context: ./flight_producer
      depends_on:
        - rethinkdb
      environment:
        DB_HOST: rethinkdb
